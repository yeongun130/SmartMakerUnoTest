<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>Kakao 지도 시작하기</title>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=#API_KEY"></script>
    <style>
        #roadviewControl {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 42px;
            height: 42px;
            z-index: 1;
            cursor: pointer;
            display: none;
            background: url(https://t1.daumcdn.net/localimg/localimages/07/2018/pc/common/img_search.png) 0 -450px no-repeat;
        }

            #roadviewControl.active {
                background-position: 0 -350px;
            }
    </style>
</head>

<body onload="initialize()" style="margin:0x; overflow:hidden">
    <div id="mapWrapper" style="width: 100%; height:100%">
        <div id="map_canvas" style="width:100%; height:100%"></div>
        <div id="roadviewControl" onclick="setRoadviewRoad()"></div>
    </div>
    <div id="rvWrapper" style="width: 100%;height:0%">
        <div id="roadview" style="width:100%;height:100%"></div> <!-- 로드뷰를 표시할 div 입니다 -->
    </div>
    <script>
        var markers;
        //Path 표시 경로
        var pathes;
        var polyline;
        var map;
        var currentmapInfo;

        // 로드뷰에 사용되는 객체
        var overlayOn = false;
        var rvMarker;
        var mapWrapper = document.getElementById('mapWrapper'); //지도를 감싸고 있는 DIV태그
        var rvContainer = document.getElementById('roadview'); //로드뷰를 표시할 div
        var rv = new kakao.maps.Roadview(rvContainer); //로드뷰 객체        
        var rvClient = new kakao.maps.RoadviewClient(); //좌표로부터 로드뷰 파노ID를 가져올 로드뷰 helper객체
        
        function initialize() {
            markers = [];
            pathes = [];
            var mapContainer = document.getElementById('map_canvas'), // 지도를 표시할 div
            mapCenter = new kakao.maps.LatLng(#위도, #경도), // 지도의 가운데 좌표
            mapOption = {
                center: mapCenter, // 지도의 중심좌표
                level: #ZOOM // 지도의 확대 레벨
            };
            // 지도를 표시할 div와  지도 옵션으로  지도를 생성합니다
            map = new kakao.maps.Map(mapContainer, mapOption);
            //#MAKER

            //#PATH

            //geocoder = new kakao.maps.Geocoder();
            //#GEOCODER
            
            if ("#MAPTYPE" == "ROADVIEW")
            {
                var rvControl = document.getElementById("roadviewControl");
                rvControl.style.display = "block";

                // 마커 이미지를 생성합니다.
                var markImage = new kakao.maps.MarkerImage(
                    'https://t1.daumcdn.net/localimg/localimages/07/2018/pc/roadview_minimap_wk_2018.png',
                    new kakao.maps.Size(26, 46),
                    {
                        // 스프라이트 이미지를 사용합니다.
                        // 스프라이트 이미지 전체의 크기를 지정하고
                        spriteSize: new kakao.maps.Size(1666, 168),
                        // 사용하고 싶은 영역의 좌상단 좌표를 입력합니다.
                        // background-position으로 지정하는 값이며 부호는 반대입니다.
                        spriteOrigin: new kakao.maps.Point(705, 114),
                        offset: new kakao.maps.Point(13, 46)
                    }
                );
                
                // 드래그가 가능한 마커를 생성합니다.
                rvMarker = new kakao.maps.Marker({
                    image: markImage,
                    position: mapCenter,
                    draggable: true
                });

                //마커에 dragend 이벤트를 할당합니다
                kakao.maps.event.addListener(rvMarker, 'dragend', function () {
                    var position = rvMarker.getPosition(); //현재 마커가 놓인 자리의 좌표
                    toggleRoadview(position); //로드뷰를 토글합니다
                });
            }
            else
            {
                map.setMapTypeId(kakao.maps.MapTypeId.#MAPTYPE);
            }

            kakao.maps.event.addListener(map, 'mousedown', function (mouseEvent) {
                var latlng = mouseEvent.latLng;
                form_getClickPos(latlng.getLat(), latlng.getLng());
            });

            kakao.maps.event.addListener(map, 'mouseup', function () {
                var latlng = map.getCenter();
                form_getDragCenterPos(latlng.getLat(), latlng.getLng());
            });

            kakao.maps.event.addListener(rv, 'position_changed', function () {

                // 현재 로드뷰의 위치 좌표를 얻어옵니다
                var rvPosition = rv.getPosition();

                // 지도의 중심을 현재 로드뷰의 위치로 설정합니다
                map.setCenter(rvPosition);

                // 지도 위에 로드뷰 도로 오버레이가 추가된 상태이면
                if (overlayOn) {
                    // 마커의 위치를 현재 로드뷰의 위치로 설정합니다
                    rvMarker.setPosition(rvPosition);
                }
            });

            //지도에 클릭 이벤트를 할당합니다
            kakao.maps.event.addListener(map, 'click', function (mouseEvent) {
                if (!overlayOn) return;
                // 현재 클릭한 부분의 좌표를 리턴
                var position = mouseEvent.latLng;

                rvMarker.setPosition(position);
                toggleRoadview(position); //로드뷰를 토글합니다
            });
        }

        //지도 중심 이동
        function centerMap(latitude, longitude) {
            var centerPoint = new kakao.maps.LatLng(latitude, longitude);
            map.setCenter(centerPoint);
        }

        //지도 마커 추가
        function addMarker(title, formPath, property, latitude, longitude, imgpath) {
            var latlng = new kakao.maps.LatLng(latitude, longitude);

            var tmpmarker;
            //if(imgpath && imgpath.length !== 0 )
            //{
            //    tmpmarker = placeMarker2(latlng, map, title, formPath, property, latitude, longitude, imgpath);
            //}
            //else
            //{
            //    tmpmarker = placeMarker(latlng, map, title, formPath, property, latitude, longitude);
            //}

            tmpmarker = placeMarker(latlng, map, title, formPath, property, latitude, longitude);

            markers.push(tmpmarker);
        }

        function drawMarker() {
            var arrayLength = markers.length;
            for (var i = 0; i < arrayLength; i++) {
                if (markers[i]) {
                    markers[i].setMap(map);
                }
            }
        }

        //지도 마커 초기화
        function clearMarker() {
            if (null != currentmapInfo)
                currentmapInfo.close();

            var arrayLength = markers.length;
            for (var i = 0; i < arrayLength; i++) {
                if (markers[i]) {
                    markers[i].setMap(null);
                }
            }
            markers = [];
        }

        //경로 더하기
        function addPath(latitude, longitude) {
            var latlng = new kakao.maps.LatLng(latitude, longitude);
            pathes.push(latlng);
        }

        //경로 그리기
        function drawPath() {
            polyline = new kakao.maps.Polyline({
                map: map,
                path: pathes,
                strokeColor: '#0000FF',
            });

            polyline.setMap(map);
        }

        //경로 초기화
        function clearPath() {
            polyline.setMap(null);
            pathes = [];
        }

        function placeMarker2(position, map, title, formPath, property, latitude, longitude, imgpath) {
            var markerImage = new kakao.maps.MarkerImage(imgpath, new kakao.maps.Size(31, 35));
            var marker = new kakao.maps.Marker(
                {
                    position: position,
                    image: markerImage
                });

            kakao.maps.event.addListener(marker, 'click', function (e) {
                //marker.setPosition(e.coord);

                var eventTag = "linkDetailForm(" + "'" + encodeURIComponent(formPath) + "'" + "," + "'" + property + "'" + ")";
                var contentString =
                    '<div id="contentMap">' +
                    '<br><div id=="adressMap">' +
                    //'<input type="button" value="클릭" onclick="overlay.toggle();"></input>'+
                    //'<a href="#" onClick="linkDetailForm(title)">상세폼연결</a> '+
                    '<a href="#" onClick=' + eventTag + ";" + '>' + title +
                    '</a>' +
                    '<br></div>' +
                    '<p>'
                '</p>' +
                    '</div>';

                var infowindow = new kakao.maps.InfoWindow({
                    content: contentString,
                    removable: true
                })

                if (title && title.length !== 0) {
                    if (currentmapInfo)
                        currentmapInfo.close();

                    currentmapInfo = infowindow;

                    if (infowindow.getMap()) {
                        infowindow.close();
                    } else {
                        infowindow.open(map, marker);
                    }
                }
                var pos = marker.getPosition();
                latitude = pos.getLat();
                longitude = pos.getLng();
                form_clickMaker(latitude, longitude, property);

                return (marker);

            });

            return (marker);
        }
        function placeMarker(position, map, title, formPath, property, latitude, longitude) {
            var marker = new kakao.maps.Marker(
                {
                    position: position
                });

            kakao.maps.event.addListener(marker, 'click', function (e) {
                //marker.setPosition(e.coord);

                var eventTag = "linkDetailForm(" + "'" + encodeURIComponent(formPath) + "'" + "," + "'" + property + "'" + ")";
                var contentString =
                    '<div id="contentMap">' +
                    '<br><div id=="adressMap">' +
                    //'<input type="button" value="클릭" onclick="overlay.toggle();"></input>'+
                    //'<a href="#" onClick="linkDetailForm(title)">상세폼연결</a> '+
                    '<a href="#" onClick=' + eventTag + ";" + '>' + title +
                    '</a>' +
                    '<br></div>' +
                    '<p>'
                '</p>' +
                    '</div>';

                var infowindow = new kakao.maps.InfoWindow({
                    content: contentString
                })
                if (title && title.length !== 0) {
                    if (currentmapInfo)
                        currentmapInfo.close();

                    currentmapInfo = infowindow;

                    if (infowindow.getMap()) {
                        infowindow.close();
                    } else {
                        infowindow.open(map, marker);
                    }
                }
                var pos = marker.getPosition();

                latitude = pos.getLat();
                longitude = pos.getLng();

                form_clickMaker(latitude, longitude, property);

                return (marker);

            });

            return (marker);
        }

        function form_getClickPos(latitude, longitude) {
            mapCallForm.getClickPos(latitude, longitude);
        }

        function form_getDragCenterPos(latitude, longitude) {
            mapCallForm.getDragCenterPos(latitude, longitude)
        }

        function linkDetailForm(filePath, property) {
            mapCallForm.openQPMFile(decodeURIComponent(filePath), property);
        }

        function form_clickMaker(latitude, longitude, property) {
            mapCallForm.clickMaker(latitude, longitude, property)
        }

        function codeAddress(address, map) {
            geocoder.geocode({ 'address': address }, function (results, status) {
                if (status == kakao.maps.GeocoderStatus.OK) {
                    map.setCenter(results[0].geometry.location);
                    var marker = new kakao.maps.Marker({
                        map: map,
                        position: results[0].geometry.location
                    });

                    var infowindow = new kakao.maps.InfoWindow({
                        content: address,
                        size: new google.maps.Size(100, 100)
                    })
                    infowindow.open(map, marker);
                }
                else {
                    alert('Geocode was not successful for the following reason: ' + status);
                }
            });
        }

        //로드뷰 toggle함수
        function toggleRoadview(position) {

            //전달받은 좌표(position)에 가까운 로드뷰의 panoId를 추출하여 로드뷰를 띄웁니다
            rvClient.getNearestPanoId(position, 40, function (panoId) {                
                if (panoId === null) {
                    toggleMapWrapper(true, position);
                } else {
                    toggleMapWrapper(false, position);

                    // panoId로 로드뷰를 설정합니다
                    rv.setPanoId(panoId, position);
                }
            });
        }

        function toggleMapWrapper(active, position) {
            if (active) {

                rvContainer.style.display = 'none'; //로드뷰를 넣은 컨테이너를 숨깁니다
                mapWrapper.style.height = '100%';
                rvWrapper.style.height = '0%';
                map.relayout();

                // 지도의 크기가 변경되었기 때문에 relayout 함수를 호출합니다
                map.relayout();

                // 지도의 너비가 변경될 때 지도중심을 입력받은 위치(position)로 설정합니다
                map.setCenter(position);
            } else {
                mapWrapper.style.height = '70%';
                rvWrapper.style.height = '30%';
                map.relayout(); //지도를 감싸고 있는 영역이 변경됨에 따라, 지도를 재배열합니다
                rvContainer.style.display = 'block'; //로드뷰를 넣은 컨테이너를 보이게합니다
                rv.relayout(); //로드뷰를 감싸고 있는 영역이 변경됨에 따라, 로드뷰를 재배열합니다

                // 지도의 너비가 변경될 때 지도중심을 입력받은 위치(position)로 설정합니다
                map.setCenter(position);
            }
        }

        // 지도 위의 로드뷰 버튼을 눌렀을 때 호출되는 함수입니다
        function setRoadviewRoad() {
            var control = document.getElementById('roadviewControl');

            // 버튼이 눌린 상태가 아니면
            if (control.className.indexOf('active') === -1) {
                control.className = 'active';

                // 로드뷰 도로 오버레이가 보이게 합니다
                toggleOverlay(true);
            } else {
                control.className = '';

                // 로드뷰 도로 오버레이를 제거합니다
                toggleOverlay(false);
            }
        }

        // 지도 위의 로드뷰 도로 오버레이를 추가,제거하는 함수입니다
        function toggleOverlay(active) {
            if (active) {
                overlayOn = true;

                // 지도 위에 로드뷰 도로 오버레이를 추가합니다
                map.addOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);

                // 지도 위에 마커를 표시합니다
                rvMarker.setMap(map);

                // 마커의 위치를 지도 중심으로 설정합니다
                rvMarker.setPosition(map.getCenter());

                // 로드뷰의 위치를 지도 중심으로 설정합니다
                toggleRoadview(map.getCenter());
            } else {
                overlayOn = false;

                // 지도 위의 로드뷰 도로 오버레이를 제거합니다
                map.removeOverlayMapTypeId(kakao.maps.MapTypeId.ROADVIEW);

                // 지도 위의 마커를 제거합니다
                rvMarker.setMap(null);
                closeRoadview();
            }
        }

        function closeRoadview() {
            var position = rvMarker.getPosition();
            toggleMapWrapper(true, position);
        }
    </script>
</body>
</html>
