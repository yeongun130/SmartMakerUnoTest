<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body, #container { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
</style>
</head>
<body>
<div id="container"></div>
<script src="vs/loader.js"></script>
<script>
  // postWebViewMessage - Uno docs' cross-platform WebView2 JS->C# bridge helper (Windows/Android/iOS/macOS/WASM).
  function postWebViewMessage(message) {
    try {
      if (window.hasOwnProperty("chrome") && typeof chrome.webview !== "undefined") {
        chrome.webview.postMessage(message);
      } else if (window.hasOwnProperty("unoWebView")) {
        unoWebView.postMessage(JSON.stringify(message));
      } else if (window.hasOwnProperty("webkit") && typeof webkit.messageHandlers !== "undefined") {
        webkit.messageHandlers.unoWebView.postMessage(JSON.stringify(message));
      }
    } catch (ex) {
      console.error("postWebViewMessage failed", ex);
    }
  }

  var editor = null;
  var knownClasses = {};
  var suppressChangeNotify = false;
  var changeTimer = null;

  // kind: "fg" (text color) | "underline" | "strike" | "hilight" (background).
  // Mirrors CodeBox.cs's overlay drawing (DrawLineColoredText/DrawRangeLines/DrawRangeBackgrounds) - each
  // decoration range keeps the source Decoration's own Brush color rather than a fixed style color.
  function ensureClass(kind, hex) {
    var cls = "mc-" + kind + "-" + hex.replace("#", "");
    if (!knownClasses[cls]) {
      var rule;
      if (kind === "fg") rule = "color:" + hex + " !important;";
      else if (kind === "underline") rule = "text-decoration: underline; text-decoration-color:" + hex + ";";
      else if (kind === "strike") rule = "text-decoration: line-through; text-decoration-color:" + hex + ";";
      else if (kind === "hilight") rule = "background-color:" + hex + "59;"; // ~35% alpha suffix
      var style = document.createElement("style");
      style.innerHTML = "." + cls + " {" + rule + "}";
      document.head.appendChild(style);
      knownClasses[cls] = true;
    }
    return cls;
  }

  window.setEditorText = function (text) {
    if (!editor) return;
    suppressChangeNotify = true;
    editor.setValue(text || "");
    suppressChangeNotify = false;
  };

  window.getEditorText = function () {
    return editor ? editor.getValue() : "";
  };

  window.setEditorLanguage = function (languageId) {
    if (!editor) return;
    monaco.editor.setModelLanguage(editor.getModel(), languageId || "plaintext");
  };

  window.setEditorFontSize = function (size) {
    if (!editor) return;
    editor.updateOptions({ fontSize: size });
  };

  // ranges: [{start,end,kind,color}] with start/end as flat character offsets (converted via model.getPositionAt).
  window.applyDecorations = function (ranges) {
    if (!editor) return;
    var model = editor.getModel();
    if (!model) return;
    var decorations = ranges.map(function (r) {
      var startPos = model.getPositionAt(r.start);
      var endPos = model.getPositionAt(r.end);
      return {
        range: new monaco.Range(startPos.lineNumber, startPos.column, endPos.lineNumber, endPos.column),
        options: { inlineClassName: ensureClass(r.kind, r.color) }
      };
    });
    window._mcDecorationIds = editor.deltaDecorations(window._mcDecorationIds || [], decorations);
  };

  require.config({ paths: { vs: "./vs" } });
  require(["vs/editor/editor.main"], function () {
    editor = monaco.editor.create(document.getElementById("container"), {
      value: "",
      language: "plaintext",
      automaticLayout: true,
      theme: "vs",
      fontSize: 14
    });

    editor.onDidChangeModelContent(function () {
      if (suppressChangeNotify) return;
      if (changeTimer) clearTimeout(changeTimer);
      changeTimer = setTimeout(function () {
        postWebViewMessage({ type: "textChanged", text: editor.getValue() });
      }, 150);
    });

    postWebViewMessage({ type: "ready" });
  });
</script>
</body>
</html>
